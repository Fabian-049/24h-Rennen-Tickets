<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24h Rennen – Ticket Check-in</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="pass" id="login-card">
    <div class="checker"></div>
    <div class="pass-body">
      <p class="eyebrow">Boxenstopp Check-in</p>
      <h1>Dein Ticket</h1>
      <p class="sub">Name eingeben, Passwort eingeben, Ticket zeigen.</p>

      <form id="checkin-form">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Vor- und Nachname" autocomplete="name" required>

        <label for="password">Passwort</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="off" required>

        <button type="submit">Ticket anzeigen</button>
        <p class="error" id="error-msg">Falsches Passwort. Nochmal versuchen.</p>
      </form>
    </div>
  </div>

  <div class="stub" id="ticket-card" style="display:none;">
    <div class="checker"></div>
    <div class="stub-header">
      <p class="eyebrow">Gültiges Ticket</p>
      <h1 style="margin-bottom:0;">24h Rennen</h1>
    </div>

    <img class="stub-image" src="ticket.jpg" alt="Ticket-Motiv 24h Rennen">

    <div class="perforation"></div>

    <div class="stub-footer">
      <span class="stub-name" id="stub-name">Gast</span>
      <span class="stub-tag">Zutritt frei</span>
    </div>

    <div class="qr-section">
      <div class="qr-glow">
        <img id="qr-img" src="" alt="QR-Code für dein Ticket">
      </div>
      <p class="qr-caption">Diesen Code am Eingang scannen lassen</p>
      <p class="qr-status" id="qr-status">Warte auf Scan …</p>
    </div>
  </div>

  <!-- Vollbild-Einblendung: erscheint automatisch, sobald der QR-Code gescannt wurde -->
  <div class="vip-overlay" id="vip-overlay">
    <div class="vip-overlay-inner" id="vip-overlay-inner"></div>
  </div>

  <template id="vip-pass-template">
<svg width="420" height="640" viewBox="0 0 420 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>VIP Pass 24h Rennen</title>
<desc>VIP-Pass mit Name, Lochung, holografischem Streifen und Zielflaggen-Muster.</desc>
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#101114"/>
    <stop offset="55%" stop-color="#1a1c22"/>
    <stop offset="100%" stop-color="#0c0d0f"/>
  </linearGradient>
  <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#f4b942"/>
    <stop offset="25%" stop-color="#e0554f"/>
    <stop offset="50%" stop-color="#a86ee0"/>
    <stop offset="75%" stop-color="#3aa3d8"/>
    <stop offset="100%" stop-color="#2f9e63"/>
  </linearGradient>
  <pattern id="checker" width="14" height="14" patternUnits="userSpaceOnUse">
    <rect width="14" height="14" fill="#eef1f5"/>
    <rect width="7" height="7" fill="#101114"/>
    <rect x="7" y="7" width="7" height="7" fill="#101114"/>
  </pattern>
  <clipPath id="cardclip">
    <rect x="0" y="0" width="420" height="640" rx="22"/>
  </clipPath>
</defs>
<g clip-path="url(#cardclip)">
  <rect width="420" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="420" height="10" fill="url(#checker)"/>
  <rect x="0" y="52" width="420" height="8" fill="url(#holo)" opacity="0.9"/>
  <text x="210" y="98" text-anchor="middle" font-family="'Oswald','Arial Narrow',sans-serif" font-weight="700" font-size="15" letter-spacing="6" fill="#f4b942">FAHRERLAGER ZUGANG</text>
  <text x="210" y="150" text-anchor="middle" font-family="'Oswald','Arial Narrow',sans-serif" font-weight="700" font-size="46" letter-spacing="3" fill="#eef1f5">VIP PASS</text>
  <line x1="60" y1="172" x2="360" y2="172" stroke="#f4b942" stroke-width="1.5" opacity="0.6"/>
  <text x="210" y="212" text-anchor="middle" font-family="'Oswald','Arial Narrow',sans-serif" font-weight="600" font-size="24" letter-spacing="2" fill="#eef1f5">24H RENNEN</text>
  <text x="210" y="234" text-anchor="middle" font-family="Arial,sans-serif" font-weight="400" font-size="12" letter-spacing="3" fill="#8b909c">LIVE-EVENT · IRACING &amp; PS5</text>
  <rect x="40" y="264" width="340" height="200" rx="10" fill="#1c1f26" stroke="#2a2e37" stroke-width="1"/>
  <rect x="40" y="264" width="340" height="200" rx="10" fill="none" stroke="url(#holo)" stroke-width="1.5" opacity="0.5"/>
  <rect x="56" y="282" width="90" height="90" rx="8" fill="#0c0d0f" stroke="#3a3e47" stroke-width="1"/>
  <circle cx="101" cy="313" r="18" fill="#2a2e37"/>
  <path d="M78 358 Q101 330 124 358 Z" fill="#2a2e37"/>
  <text x="164" y="300" font-family="'Oswald','Arial Narrow',sans-serif" font-weight="500" font-size="10" letter-spacing="2" fill="#8b909c">NAME</text>
  <text id="vip-name-text" x="164" y="322" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#eef1f5">GAST</text>
  <text x="164" y="352" font-family="'Oswald','Arial Narrow',sans-serif" font-weight="500" font-size="10" letter-spacing="2" fill="#8b909c">KATEGORIE</text>
  <text x="164" y="374" font-family="Arial,sans-serif" font-weight="700" font-size="16" fill="#f4b942">ALL ACCESS</text>
  <line x1="56" y1="392" x2="364" y2="392" stroke="#2a2e37" stroke-width="1"/>
  <text x="56" y="420" font-family="'Oswald','Arial Narrow',sans-serif" font-weight="500" font-size="9" letter-spacing="1.5" fill="#5f636c">PASS-NR. 0001</text>
  <rect x="150" y="486" width="120" height="120" rx="6" fill="#eef1f5"/>
  <rect x="162" y="498" width="96" height="96" fill="#0c0d0f"/>
  <rect x="170" y="506" width="24" height="24" fill="#eef1f5"/>
  <rect x="226" y="506" width="24" height="24" fill="#eef1f5"/>
  <rect x="170" y="562" width="24" height="24" fill="#eef1f5"/>
  <rect x="200" y="536" width="20" height="20" fill="#eef1f5"/>
  <text x="210" y="622" text-anchor="middle" font-family="'Oswald','Arial Narrow',sans-serif" font-weight="500" font-size="10" letter-spacing="3" fill="#5f636c">ZUTRITT NUR MIT DIESEM PASS</text>
  <rect x="0" y="630" width="420" height="10" fill="url(#checker)"/>
</g>
<rect x="0" y="0" width="420" height="640" rx="22" fill="none" stroke="#2a2e37" stroke-width="2"/>
<g>
  <rect x="170" y="16" width="80" height="20" rx="10" fill="#0c0d0f" stroke="#3a3e47" stroke-width="1"/>
  <circle cx="210" cy="26" r="6" fill="#0c0d0f" stroke="#5f636c" stroke-width="1"/>
</g>
</svg>
  </template>

  <script>
    // ── Firebase Realtime Database ──
    // Nach dem Einrichten (siehe Anleitung) hier die eigene Datenbank-URL eintragen,
    // z.B. "https://24h-rennen-default-rtdb.europe-west1.firebasedatabase.app"
    const FIREBASE_DB_URL = "https://h-rennen-web-default-rtdb.europe-west1.firebasedatabase.app";

    const PASSWORD = "24hRennen";

    const form = document.getElementById('checkin-form');
    const errorMsg = document.getElementById('error-msg');
    const loginCard = document.getElementById('login-card');
    const ticketCard = document.getElementById('ticket-card');
    const stubName = document.getElementById('stub-name');
    const qrImg = document.getElementById('qr-img');
    const qrStatus = document.getElementById('qr-status');
    const vipOverlay = document.getElementById('vip-overlay');
    const vipOverlayInner = document.getElementById('vip-overlay-inner');

    function ticketId(name) {
      // macht aus dem Namen einen sicheren Datenbank-Schlüssel
      return name.trim().toLowerCase().replace(/[^a-z0-9äöüß]+/gi, '-');
    }

    function showVipPass(name) {
      const template = document.getElementById('vip-pass-template');
      vipOverlayInner.innerHTML = '';
      vipOverlayInner.appendChild(template.content.cloneNode(true));
      const nameEl = vipOverlayInner.querySelector('#vip-name-text');
      if (nameEl) nameEl.textContent = name.toUpperCase();
      vipOverlay.classList.add('show');
    }

    let eventSource = null;

    function listenForScan(id) {
      if (eventSource) eventSource.close();
      eventSource = new EventSource(FIREBASE_DB_URL + '/tickets/' + id + '.json');
      eventSource.addEventListener('put', function (e) {
        try {
          const payload = JSON.parse(e.data);
          if (payload && payload.data && payload.data.scanned) {
            qrStatus.textContent = 'Gescannt ✓';
            showVipPass(document.getElementById('name').value.trim());
            eventSource.close();
          }
        } catch (err) { /* ignoriere fehlerhafte Pakete */ }
      });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const password = document.getElementById('password').value;

      if (password !== PASSWORD) {
        errorMsg.classList.add('show');
        form.classList.add('shake');
        setTimeout(() => form.classList.remove('shake'), 400);
        return;
      }

      errorMsg.classList.remove('show');

      const id = ticketId(name);
      stubName.textContent = name;

      // Ticket-Status in der Datenbank zurücksetzen
      fetch(FIREBASE_DB_URL + '/tickets/' + id + '.json', {
        method: 'PUT',
        body: JSON.stringify({ name: name, scanned: false })
      }).catch(() => {});

      // QR-Code zeigt auf scan.html mit der Ticket-ID
      const base = location.href.replace(/index\.html$/, '').replace(/\/$/, '') + '/';
      const scanUrl = base + 'scan.html?id=' + encodeURIComponent(id);
      const qrApi = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data=' + encodeURIComponent(scanUrl);
      qrImg.src = qrApi;

      loginCard.style.display = 'none';
      ticketCard.style.display = 'block';

      listenForScan(id);
    });
  </script>
</body>
</html>
